name: Publish Docker Image

# The primary release artifact is the Docker image, published to GHCR when a GitHub
# release is published. Downloadable CLI binaries are produced separately, on demand,
# by release-binaries.yml.
on:
  release:
    types: [published]

# Request only what we use: read the repo, write packages (push to ghcr.io).
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name (lowercased)
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE_ID=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ env.IMAGE_ID }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_ID }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_ID }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_ID }}:buildcache,mode=max
