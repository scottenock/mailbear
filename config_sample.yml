# MailBear forms configuration.
#
# Only the per-form list lives here. Operational settings (SMTP, addresses,
# Turnstile secret, rate limit) are supplied via flags or environment variables
# — see the README or `mailbear serve --help`.

forms:
    some-form-name:
        key: some-random-key
        allowed_domains:
            - localhost:8080
            - example.com
        to_email:
            - recipient@example.com
            - another-recipient@example.com
        # Optional: name of a custom template (<name>.html / <name>.txt in the --templatesDir). Omit to use the built-in default template.
        # template: contact
        # Optional: subject line, rendered as a text/template. Omit for the default "New submission with subject: {{.Subject}}".
        # subject: "New contact form submission from {{.Name}}"
        # Optional: POST each submission as JSON to this URL (Slack/Discord/Zapier/n8n, etc.). A form needs at least one of 'to_email' or 'webhook_url'.
        # webhook_url: https://example.com/webhook
        # Optional: for plain (no-JavaScript) HTML forms, 303-redirect the browser here on success / on error. JSON clients always get JSON.
        # redirect_url: https://example.com/thanks
        # error_redirect_url: https://example.com/oops
        # Optional: send a confirmation email back to the submitter. 'template' names a <name>.html / <name>.txt pair in the --templatesDir and is required.
        # autoresponder:
        #     template: contact-ack
        #     subject: "Thanks for contacting us, {{.Name}}"
