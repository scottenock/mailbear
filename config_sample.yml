global:
    smtp:
        host: some-smtp-server-hostname
        port: 25
        user:
        password:
        disable_tls: true
        from_email: no-reply@example.com
        from_name: MailBear
    http:
        address: ":1234"
    metrics:
        address: ":9090"
    turnstile:
        # Cloudflare Turnstile secret key. Leave empty to disable captcha
        # verification (submissions then rely on the honeypot + rate limiting).
        secret:


forms:
    some-form-name:
        key: some-random-key
        allowed_domains:
            - localhost:8080
            - example.com
        to_email:
            - recipient@example.com
            - another-recipient@example.com