name: Security

# Runs govulncheck on a schedule so a vulnerability disclosed in a dependency we
# haven't touched is caught even without a code change (the per-PR/push scan in
# test.yml only runs on changes). Also runnable on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.26.0"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
