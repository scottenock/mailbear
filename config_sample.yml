# MailBear forms configuration.
#
# Only the per-form list lives here. Operational settings (SMTP, addresses,
# Turnstile secret, rate limit) are supplied via flags or environment variables
# — see the README or `mailbear serve --help`.

forms:
    some-form-name:
        key: some-random-key
        allowed_domains:
            - localhost:8080
            - example.com
        to_email:
            - recipient@example.com
            - another-recipient@example.com
