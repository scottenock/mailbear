version: "3"
services:
  mailbear:
    container_name: mailbear
    image: ghcr.io/laputalabs/mailbear:latest
    # build: .
    command: serve
    ports:
      - "1234:1234"
      # - "9090:9090" # for prometheus metrics
    environment:
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: no-reply@example.com
      SMTP_FROM_NAME: MailBear
      # SMTP_DISABLE_TLS: "false"
      # TURNSTILE_SECRET: ""
      # RATE_LIMIT: "5"
      # Uncomment to load custom email templates from the mounted directory:
      # TEMPLATES_DIR: /mailbear/templates
    volumes:
      - ./config.yml:/mailbear/config.yml
      # Mount a directory of <name>.html / <name>.txt templates (see TEMPLATES_DIR):
      # - ./templates:/mailbear/templates
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1234/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
